<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Format Lab — MicroLearn</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio">

  <nav class="st-nav d-flex align-items-center">
    <a class="st-brand" href="index.html"><span class="logo"><i class="bi bi-stars"></i></span><span>MicroLearn <small class="st-hide-sm">Format Lab</small></span></a>
    <div class="st-spaces">
      <a href="index.html"><i class="bi bi-pencil-square"></i> <span class="st-hide-sm" data-i18n="c.studio"></span></a>
      <a href="lab.html" class="active"><i class="bi bi-palette"></i> <span class="st-hide-sm" data-i18n="c.lab"></span></a>
      <a href="docs/index.html"><i class="bi bi-book"></i> <span class="st-hide-sm" data-i18n="c.docs"></span></a>
    </div>
    <div class="st-actions">
      <button class="btn btn-sm btn-st" id="act-import" data-i18n-title="l.importTitle"><i class="bi bi-upload"></i> <span class="st-hide-sm" data-i18n="l.import"></span></button>
      <button class="btn btn-sm btn-st" id="act-export-all" data-i18n-title="l.exportAllTitle"><i class="bi bi-download"></i> <span class="st-hide-sm" data-i18n="l.exportAll"></span></button>
      <div id="lang-switch"></div>
    </div>
  </nav>

  <main class="lab-main" id="main">
    <!-- LISTE DES FORMATS -->
    <aside class="lab-side" data-i18n-aria="l.formats">
      <div class="lab-side-head">
        <strong class="me-auto small text-uppercase text-secondary" data-i18n="l.formats"></strong>
        <button class="btn btn-sm btn-accent" id="act-new"><i class="bi bi-plus-lg"></i> <span data-i18n="l.new"></span></button>
      </div>
      <div class="lab-list" id="list"></div>
    </aside>

    <!-- ÉDITION DU FORMAT -->
    <section class="lab-editor" data-i18n-aria="l.editAria">
      <div class="lab-meta">
        <div><label class="form-label small mb-0" for="f-name" data-i18n="l.name"></label><input class="form-control form-control-sm" id="f-name"></div>
        <div><label class="form-label small mb-0" for="f-id" data-i18n="l.id"></label><input class="form-control form-control-sm font-monospace" id="f-id" placeholder="format-…" data-i18n-title="l.idTitle"></div>
        <div><label class="form-label small mb-0" for="f-icon"><span data-i18n="l.icon"></span> <a href="#" id="icon-help" class="small">?</a></label>
          <div class="input-group input-group-sm"><span class="input-group-text"><i id="f-icon-preview" class="bi bi-square"></i></span><input class="form-control font-monospace" id="f-icon"></div></div>
        <div><label class="form-label small mb-0" for="f-category" data-i18n="l.category"></label><input class="form-control form-control-sm" id="f-category" list="cats">
          <datalist id="cats"><option>Structure</option><option>Personnages</option><option>Découverte</option><option>Évaluation</option></datalist></div>
        <div class="full"><label class="form-label small mb-0" for="f-description" data-i18n="l.description"></label><input class="form-control form-control-sm" id="f-description"></div>
      </div>
      <ul class="nav nav-tabs lab-tabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-panel="template" role="tab"><i class="bi bi-filetype-html"></i> <span data-i18n="l.tabTemplate"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="css" role="tab"><i class="bi bi-filetype-css"></i> <span data-i18n="l.tabCss"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="js" role="tab"><i class="bi bi-filetype-js"></i> <span data-i18n="l.tabJs"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="sample" role="tab"><i class="bi bi-markdown"></i> <span data-i18n="l.tabSample"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="i18n" role="tab"><i class="bi bi-translate"></i> <span data-i18n="l.tabI18n"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="data" role="tab"><i class="bi bi-braces"></i> <span data-i18n="l.tabData"></span></button></li>
        <li class="nav-item"><button class="nav-link" data-panel="help" role="tab"><i class="bi bi-question-circle"></i> <span data-i18n="l.tabHelp"></span></button></li>
      </ul>
      <div class="lab-panels">
        <div class="lab-panel active" data-panel="template"><textarea class="st-code" id="f-template" spellcheck="false" data-i18n-aria="l.tabTemplate"></textarea></div>
        <div class="lab-panel" data-panel="css"><textarea class="st-code" id="f-css" spellcheck="false" data-i18n-aria="l.tabCss"></textarea></div>
        <div class="lab-panel" data-panel="js"><textarea class="st-code" id="f-js" spellcheck="false" data-i18n-aria="l.tabJs"></textarea></div>
        <div class="lab-panel" data-panel="sample"><textarea class="st-code light" id="f-sample" spellcheck="false" data-i18n-aria="l.tabSample"></textarea></div>
        <div class="lab-panel flex-column" data-panel="i18n">
          <p class="small text-secondary px-3 pt-2 mb-1" data-i18n="l.i18nNote"></p>
          <textarea class="st-code" id="f-i18n" spellcheck="false" data-i18n-aria="l.tabI18n"></textarea>
        </div>
        <div class="lab-panel" data-panel="data"><textarea class="st-code light" id="f-data" readonly data-i18n-aria="l.tabData"></textarea></div>
        <div class="lab-panel" data-panel="help"><div class="lab-help" id="help"></div></div>
      </div>
      <div class="lab-foot">
        <button class="btn btn-sm btn-accent" id="act-save"><i class="bi bi-floppy"></i> <span data-i18n="l.saveBtn"></span> <kbd class="small">Ctrl+S</kbd></button>
        <button class="btn btn-sm btn-outline-secondary" id="act-duplicate"><i class="bi bi-copy"></i> <span data-i18n="l.duplicate"></span></button>
        <button class="btn btn-sm btn-outline-secondary" id="act-export-one"><i class="bi bi-filetype-json"></i> <span data-i18n="l.exportOne"></span></button>
        <button class="btn btn-sm btn-outline-warning" id="act-reset"><i class="bi bi-arrow-counterclockwise"></i> <span data-i18n="l.reset"></span></button>
        <button class="btn btn-sm btn-outline-danger" id="act-delete"><i class="bi bi-trash"></i> <span data-i18n="l.delete"></span></button>
        <span class="lab-dirty ms-auto" id="dirty"></span>
      </div>
    </section>

    <div class="st-splitter" id="splitter" role="separator" aria-orientation="vertical" data-i18n-aria="c.resize" tabindex="0"></div>

    <!-- APERÇU -->
    <section class="st-pane st-pane-preview" data-i18n-aria="l.previewAria">
      <div class="st-pane-toolbar">
        <span class="st-pane-title"><i class="bi bi-play-btn"></i> <span data-i18n="l.liveTest"></span></span>
        <div class="btn-group btn-group-sm" role="group" data-i18n-aria="c.deviceGroup">
          <input type="radio" class="btn-check" name="device" id="dev-desktop" value="desktop" checked>
          <label class="btn btn-outline-secondary" for="dev-desktop" data-i18n-title="c.deviceDesktop"><i class="bi bi-display"></i></label>
          <input type="radio" class="btn-check" name="device" id="dev-tablet" value="tablet">
          <label class="btn btn-outline-secondary" for="dev-tablet" data-i18n-title="c.deviceTablet"><i class="bi bi-tablet"></i></label>
          <input type="radio" class="btn-check" name="device" id="dev-mobile" value="mobile">
          <label class="btn btn-outline-secondary" for="dev-mobile" data-i18n-title="c.deviceMobile"><i class="bi bi-phone"></i></label>
        </div>
        <select class="form-select form-select-sm w-auto" id="test-lang" data-i18n-aria="l.testLang" data-i18n-title="l.testLang"></select>
        <select class="form-select form-select-sm w-auto" id="theme" data-i18n-aria="l.testTheme">
          <option value="violet">Violet</option><option value="ocean">Ocean</option><option value="sunset">Sunset</option><option value="forest">Forest</option><option value="night">Night</option>
        </select>
        <button class="btn btn-sm btn-outline-secondary" id="act-cast" data-i18n-title="l.cast" data-i18n-aria="l.cast"><i class="bi bi-people"></i></button>
        <button class="btn btn-sm btn-outline-secondary" id="act-refresh" data-i18n-title="l.refresh" data-i18n-aria="l.refresh"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
      <div class="st-preview-area" id="preview-area" data-device="desktop">
        <div class="st-device" id="device"><iframe id="preview" src="player.html" data-i18n-title="l.previewAria"></iframe></div>
        <span class="st-device-label" id="device-label"></span>
      </div>
    </section>
  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/marked/marked.min.js"></script>
  <script src="js/core/mls.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/studio/i18n-ui.js"></script>
  <script src="js/core/yaml.js"></script>
  <script src="js/core/template.js"></script>
  <script src="js/core/parser.js"></script>
  <script src="js/core/formats.js"></script>
  <script src="js/formats/title.js"></script>
  <script src="js/formats/content.js"></script>
  <script src="js/formats/dialogue.js"></script>
  <script src="js/formats/conseil.js"></script>
  <script src="js/formats/quiz.js"></script>
  <script src="js/formats/flashcards.js"></script>
  <script src="js/formats/timeline.js"></script>
  <script src="js/formats/hotspots.js"></script>
  <script src="js/formats/tabs.js"></script>
  <script src="assets/characters/catalog.js"></script>
  <script src="js/studio/ui.js"></script>
  <script src="js/lab/help.js"></script>
  <script src="js/lab/lab.js"></script>
</body>
</html>
